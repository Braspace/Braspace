<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>moonproof · Landing Lab</title>
<link rel="stylesheet" href="core/tokens.css"><link rel="stylesheet" href="core/components.css"><link rel="stylesheet" href="screens/landing.css">
<script type="module" src="screens/landing.js"></script>
</head>
<body class="lab">
<div id="stage" class="lab-stage" tabindex="0" role="application" data-i18n-aria="lab.title"></div>
<svg id="guides" class="lab-guides" aria-hidden="true" hidden><path stroke-dasharray="2 8" stroke-width="1.5" opacity=".9"/><path stroke-dasharray="1 6" stroke-width="1" opacity=".6"/></svg>
<div class="lab-sim" id="simseal" role="note"></div>
<div class="lab-bar mp-glass" id="bar"></div>
<div class="lab-strip" id="strip"></div>
<div class="lab-tape lab-alt" id="alt" aria-live="off"></div>
<div class="lab-tape lab-vz" id="vz" aria-live="off"></div>
<section class="lab-bottom" id="bottom"></section>
<div class="lab-touch" id="touch" hidden></div>
<dialog id="help" class="mp-card lab-help"></dialog>
<p class="sr-only" id="live" role="status" aria-live="polite"></p>
</body>
</html>
