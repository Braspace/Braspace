<!doctype html>
<html data-moon-preview="map" lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MoonProof · Kit Aula · Apresentar</title>
<meta name="description" content="Class kit: present a lunar south pole scenario to a room, with large type and one question at a time.">
  <link rel="stylesheet" href="core/tokens.css">
  <link rel="stylesheet" href="core/components.css">
  <link rel="stylesheet" href="screens/present.css">
  <link rel="stylesheet" href="screens/tour.css">
  <script type="module" src="screens/tour.js" data-moon-tour="present"></script>
<link rel="stylesheet" href="../moon-hd/preview.css">
<script type="module" src="../moon-hd/backdrop.js" data-moon-backdrop="globe" data-moon-lazy></script>
</head>
<body class="mp-present">
  <div id="terrain"></div>
  <header class="mp-present-top">
    <div class="mp-present-brand">
      <svg width="32" height="32" viewBox="0 0 28 28" role="img" aria-label="BRASPACE"><circle cx="14" cy="14" r="11" fill="none" stroke="#F2F4F5" stroke-width="1.8"/><path d="M14 3a11 11 0 0 1 0 22a7 11 0 0 0 0-22z" fill="#2EC4A0"/></svg>
      <strong>moonproof</strong>
      <span class="mp-pill-white">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5z"/><path d="M8 15v2M12 11v6M16 8v9"/></svg>
        <span id="present-badge"></span>
      </span>
    </div>
    <div class="mp-present-right">
      <div data-mp-tour-slot></div>
      <div id="present-progress" class="mp-progress" role="img"></div>
      <a id="present-exit" class="mp-btn-exit" href="activity.html"></a>
    </div>
  </header>
  <section id="present-question" class="mp-present-q"></section>
  <aside class="mp-present-side">
    <button id="present-timer" class="mp-glass mp-timer-card" type="button"></button>
    <div id="present-privacy" class="mp-glass mp-privacy-card"></div>
  </aside>
  <section class="mp-present-bottom">
    <div id="present-cards" class="mp-present-cards"></div>
    <div class="mp-present-actions">
      <button id="btn-none" class="mp-btn-outline mp-quiz-none" type="button" aria-pressed="false"></button>
      <div id="present-feedback" class="mp-quiz-feedback" role="status" aria-live="polite"></div>
      <button id="btn-reveal" class="mp-btn-jade" type="button"></button>
      <button id="btn-next" class="mp-btn-outline" type="button"></button>
    </div>
  </section>
  <script type="module" src="screens/present.js"></script>
</body>
</html>
