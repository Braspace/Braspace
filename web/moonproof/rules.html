<!doctype html>
<html data-moon-preview="decorative" lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MoonProof · Regras</title>
<meta name="description" content="The rules MoonProof follows: how sunlight, Earth visibility and battery margin are computed, sourced and sealed.">
  <link rel="stylesheet" href="core/tokens.css">
  <link rel="stylesheet" href="core/components.css">
  <link rel="stylesheet" href="screens/rules.css">
<script type="module" src="../moon-hd/backdrop.js" data-moon-backdrop="pole"></script>
<link rel="stylesheet" href="../moon-hd/preview.css">
<link rel="stylesheet" href="screens/tour.css">
<script type="module" src="screens/tour.js" data-moon-tour="rules"></script>
</head>
<body class="mp-rules-body">
  <main id="rules-root" class="mp-rules" aria-labelledby="rules-h1">
    <header class="mp-rules-head">
      <p class="mp-rules-eyebrow" data-i18n="rules.eyebrow"></p>
      <h1 id="rules-h1" data-i18n="rules.title"></h1>
      <p class="mp-rules-lead" data-i18n="rules.lead"></p>
    </header>
    <section class="mp-rules-sec" aria-labelledby="rules-core-h">
      <h2 class="mp-rules-ov" id="rules-core-h" data-i18n="rules.core.h"></h2>
      <div id="rules-core" class="mp-rules-grid4"></div>
    </section>
    <section class="mp-rules-sec" aria-labelledby="rules-layers-h">
      <h2 class="mp-rules-ov" id="rules-layers-h" data-i18n="rules.layers.h"></h2>
      <p id="rules-example" class="mp-rules-example"></p>
      <div id="rules-layers" class="mp-rules-cols"></div>
    </section>
    <section class="mp-rules-sec" aria-labelledby="rules-kits-h">
      <h2 class="mp-rules-ov" id="rules-kits-h" data-i18n="rules.kits.h"></h2>
      <div id="rules-kits" class="mp-rules-grid2"></div>
    </section>
    <div class="mp-rules-split">
      <section class="mp-card mp-rules-who" aria-labelledby="rules-who-h">
        <h2 class="mp-rules-card-h" id="rules-who-h" data-i18n="rules.who.h"></h2>
        <div class="mp-rules-scroll" id="rules-who"></div>
        <p class="mp-rules-note" data-i18n="rules.who.note"></p>
      </section>
      <section aria-labelledby="rules-sys-h">
        <h2 class="mp-rules-ov" id="rules-sys-h" data-i18n="rules.sys.h"></h2>
        <ul id="rules-sys" class="mp-rules-list"></ul>
      </section>
    </div>
  </main>
  <script type="module" src="screens/rules.js"></script>
</body>
</html>
