<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRASPACE · Computador de bordo</title>
<style>
/* Dashboard shell: navy sidebar, light card grid, one primary action (floating button).
   Layout reference: operations dashboards with a left section menu, a top filter bar and
   cards of big numbers, donuts, maps and bars. Educational simulator. Synthetic data. */
:root {
  --side: #1f3a52; --side2: #2a4a66; --side-txt: #c9d6e2; --side-dim: #7f97ab;
  --bg: #f2f4f7; --card: #ffffff; --ink: #1d2733; --muted: #6b7785; --line: #e3e8ee;
  --blue: #2c5f8a; --green: #2fa36b; --red: #b6283a; --amber: #e8a317; --sky: #5fb3d8; --navy: #1f3a52;
  --sun: #e8a317; --earth: #2c8fb8; --dark: #d9e0e8;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
body { overflow-x: hidden; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); font-size: 12px; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

/* ---- shell ---- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } }

aside.side { background: var(--side); color: var(--side-txt); padding: 18px 0 16px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
@media (max-width: 860px) { aside.side { position: static; height: auto; padding: 10px 0; } }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 18px 16px; color: #fff; font-weight: 600; letter-spacing: .04em; }
.logo { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--sky); display: grid; place-items: center; color: var(--sky); font-size: 15px; }
.brand small { display: block; color: var(--side-dim); font-weight: 400; letter-spacing: 0; font-size: 11px; }
nav.tabs { display: flex; flex-direction: column; padding: 0 8px; gap: 2px; }
@media (max-width: 860px) { nav.tabs { flex-direction: row; overflow-x: auto; padding: 0 10px 6px; } }
.grp { color: var(--side-dim); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 14px 12px 4px; }
nav.tabs button {
  appearance: none; border: 0; background: transparent; color: var(--side-txt); font: 14px var(--sans);
  text-align: left; padding: 9px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px; white-space: nowrap;
}
nav.tabs button .ic { width: 18px; text-align: center; color: var(--side-dim); font-size: 13px; }
nav.tabs button:hover { background: var(--side2); color: #fff; }
nav.tabs button[aria-pressed="true"] { background: var(--side2); color: #fff; box-shadow: inset 3px 0 0 var(--sky); }
nav.tabs button[aria-pressed="true"] .ic { color: var(--sky); }
.side-foot { margin-top: auto; padding: 14px 18px 0; font-size: 11px; color: var(--side-dim); }

main.shell { min-width: 0; display: flex; flex-direction: column; }
header.top { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.filter { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; background: #fff; color: var(--ink); font-size: 13px; min-height: 36px; }
.filter b { font-weight: 600; }
.filter select, .filter input { border: 0; background: transparent; font: inherit; color: inherit; padding: 0; }
.pillbtn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; font: 13px var(--sans); cursor: pointer; color: var(--ink); min-height: 36px; }
.pillbtn[aria-pressed="true"] { background: var(--blue); color: #fff; border-color: var(--blue); }
.status { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 12px; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); background: #fff; color: var(--muted); white-space: nowrap; }
.chip.ok { color: #1d7a4f; border-color: #bfe5d1; background: #eefaf3; }
.chip.warn { color: #8a5a00; border-color: #f1d9a4; background: #fff8e8; }
.chip.bad { color: #8d1d2b; border-color: #f0c2c8; background: #fdf0f2; }
.chip.info { color: var(--blue); border-color: #c9dbea; background: #f1f7fc; }

.content { padding: 18px 20px 90px; display: grid; gap: 16px; min-width: 0; }
.title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.title h1 { font-size: 20px; margin: 0; font-weight: 600; }
.title p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

/* ---- cards ---- */
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
@media (min-width: 760px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.span2 { grid-column: 1 / -1; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
.panel h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h2 em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12px; }
.kpi .label { font-size: 13px; color: var(--muted); }
.kpi .value { font-size: 34px; font-weight: 600; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.kpi .delta { font-size: 13px; margin-top: 4px; }
.kpi .delta.up { color: var(--green); } .kpi .delta.down { color: var(--red); } .kpi .delta.flat { color: var(--muted); }

/* ---- readouts / tables / forms (restyled) ---- */
.readout { display: grid; grid-template-columns: minmax(0, 1fr) auto; margin: 0; }
.readout dt, .readout dd { padding: 8px 0; border-bottom: 1px solid var(--line); margin: 0; }
.readout dt { color: var(--muted); font-size: 13px; }
.readout dd { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.readout dd.fuelout { color: var(--red); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { color: var(--muted); font-weight: 500; font-size: 12px; }
.table td.n, .table th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; min-width: 0; }
.fields { display: grid; gap: 14px 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
input, select { font: 14px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0; }
input:focus, select:focus { border-color: var(--sky); outline: none; }
input[aria-invalid="true"] { border-color: var(--red); }
input[type="range"] { accent-color: var(--blue); padding: 0; border: 0; min-height: 28px; }
.hint { font-size: 12px; color: var(--muted); }
.hint.err { color: var(--red); }
button { font: 13px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-height: 36px; cursor: pointer; }
button:hover { border-color: #b8c4d0; }
button.go { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
button.go:hover { background: #24527a; }
button:disabled { opacity: .55; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-weight: 500; }
.tag.SIM { color: #1d7a4f; border-color: #bfe5d1; background: #eefaf3; }
.tag.PARC { color: #8a5a00; border-color: #f1d9a4; background: #fff8e8; }
.tag.PEND { color: var(--muted); }
.tag.BLOQ { color: #8d1d2b; border-color: #f0c2c8; background: #fdf0f2; }
.tag.ESQ { color: #5b4aa6; border-color: #d9d2f2; background: #f6f4fd; }
.tag.SINT { color: #8a5a00; border-color: #f1d9a4; background: #fff8e8; }
.note { font-size: 12px; color: var(--muted); margin: 10px 0 0; max-width: 72ch; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--green); border-radius: 999px; }
.bar.warn > span { background: var(--amber); } .bar.bad > span { background: var(--red); }
.strip { display: flex; height: 14px; border-radius: 4px; overflow: hidden; }
.strip > i { flex: 1 1 0; min-width: 0; display: block; }
.caution { background: #fff8e8; border: 1px solid #f1d9a4; color: #6b4b00; border-radius: 10px; padding: 10px 14px; font-size: 13px; }
.caution[role="alert"] { background: #fdf0f2; border-color: #f0c2c8; color: #8d1d2b; }
.edu { background: #f1f7fc; border: 1px solid #c9dbea; color: #24527a; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-top: 10px; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; }
textarea { width: 100%; min-height: 140px; font: 12px var(--mono); color: var(--ink); background: #fbfcfd; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
svg text { font: 11px var(--sans); fill: var(--muted); }
.hidden { display: none !important; }

/* ---- alarms (top of content) ---- */
details.alarm { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
details.alarm.none { border-left-color: var(--green); }
details.alarm summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; list-style: none; }
details.alarm summary::-webkit-details-marker { display: none; }
details.alarm .count { color: var(--red); font-weight: 600; }
details.alarm ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }
details.alarm .sev-CRITICAL { color: var(--red); } details.alarm .sev-HIGH { color: #9a6200; } details.alarm .sev-MEDIUM { color: var(--muted); }

/* ---- floating primary action ---- */
.fab { position: fixed; right: 22px; bottom: 22px; width: 56px; height: 56px; border-radius: 50%; background: var(--red); border: 0; color: #fff; font-size: 26px; box-shadow: 0 6px 18px rgba(182,40,58,.35); display: grid; place-items: center; padding: 0; min-height: 0; }
.fab:hover { background: #9a2030; }
.fab[aria-busy="true"] { opacity: .7; }
.fab span.tip { position: absolute; right: 66px; background: var(--ink); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
.fab:hover span.tip, .fab:focus-visible span.tip { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true">B</div>
      <div>BRASPACE<small>Computador de bordo</small></div>
    </div>
    <nav class="tabs" aria-label="Painéis">
      <div class="grp">Missão</div>
      <button type="button" data-tab="visao" aria-pressed="true"><span class="ic">◉</span>Visão geral</button>
      <button type="button" data-tab="entrada" aria-pressed="false"><span class="ic">✎</span>Entrada</button>
      <button type="button" data-tab="geometria" aria-pressed="false"><span class="ic">☀</span>Geometria</button>
      <button type="button" data-tab="horizonte" aria-pressed="false"><span class="ic">⌒</span>Horizonte</button>
      <button type="button" data-tab="janelas" aria-pressed="false"><span class="ic">▭</span>Janelas</button>
      <div class="grp">Recursos</div>
      <button type="button" data-tab="energia" aria-pressed="false"><span class="ic">⚡</span>Energia</button>
      <button type="button" data-tab="vida" aria-pressed="false"><span class="ic">✚</span>Vida</button>
      <div class="grp">Análise</div>
      <button type="button" data-tab="replan" aria-pressed="false"><span class="ic">↻</span>Replanejar</button>
      <button type="button" data-tab="visual" aria-pressed="false"><span class="ic">◎</span>Visual</button>
      <button type="button" data-tab="sens" aria-pressed="false"><span class="ic">≈</span>Sensibilidade</button>
      <div class="grp">Dados</div>
      <button type="button" data-tab="historico" aria-pressed="false"><span class="ic">☰</span>Registro</button>
      <button type="button" data-tab="lanc" aria-pressed="false"><span class="ic">↑</span>Lançamentos</button>
      <button type="button" data-tab="status" aria-pressed="false"><span class="ic">✓</span>Status</button>
    </nav>
    <div class="side-foot">Dados sintéticos. Não é software de voo.</div>
  </aside>

  <main class="shell">
    <header class="top">
      <label class="filter" title="Sítio sintético (dados de exemplo)"><b>Sítio</b>
        <select id="top-site" aria-label="Sítio"></select>
      </label>
      <div class="filter"><span>UTC</span><b class="num" id="utc">--:--:--</b><span class="dim num" id="met">T- --</span></div>
      <div class="status" role="status" aria-label="Estado do sistema">
        <span class="chip ok">Sintético</span>
        <span class="chip warn">Não validado</span>
        <span class="chip info" id="lamp-api">API ?</span>
        <span class="chip bad">Sem recomendação de voo</span>
      </div>
    </header>

    <div class="content">
      <details class="alarm none" id="alarm" open>
        <summary id="alarm-sum">Sem alarmes do modelo</summary>
        <ul id="alarm-list"></ul>
      </details>
      <section id="views" class="grid" aria-live="polite"></section>
    </div>
  </main>
</div>

<button type="button" class="fab" id="fab" aria-label="Calcular cenário com a API">+<span class="tip">Calcular cenário (API)</span></button>

<script src="sim.js"></script>
<script src="request.js"></script>
<script src="model.js"></script>
<script src="features.js"></script>
<script src="api.js"></script>
<script src="cockpit.js"></script>
</body>
</html>
