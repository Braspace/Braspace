services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Optional exact-origin allowlist for Pages/external frontend. The Go
    # middleware rejects wildcard origins; empty disables cross-origin access.
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${BRASPACE_PORT:-8080}:8080"
    read_only: true
    # Verified NASA 3D model is cached on disk (streamed, not held in memory).
    # tmpfs counts toward mem_limit: 32m is the cap, the model is 13.8 MB.
    tmpfs:
      - /var/cache/braspace:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 3
