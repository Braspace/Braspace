name: MoonProof Polar Lab Chromium / Go-Rust integration
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/landing-lab-browser.yml"
  push:
    branches:
      - "integration/heloisa-polar-lab-api-20261114"
permissions:
  contents: read
jobs:
  browser:
    name: Real Chromium desktop/mobile and live Go-Rust backend
    # See ci.yml: CI_RUNS_ON selects the runner (self-hosted exo-x1 while hosted minutes are blocked).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Rust visibility executable
        run: cargo build --locked --manifest-path engine/Cargo.toml
      - name: Build Go mission API
        working-directory: api
        run: go build -o "$RUNNER_TEMP/braspace-api" .
      - name: Install Playwright and headless Chromium
        working-directory: web
        run: |
          npm install --no-save playwright@1.56.1
          # --with-deps uses apt (Ubuntu runners); self-hosted Fedora already has Chromium's system libraries.
          if command -v apt-get >/dev/null 2>&1; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - name: Start isolated real backend and run Chromium QA
        env:
          RUST_ENGINE_BIN: ${{ github.workspace }}/engine/target/debug/braspace-lunar-engine
          BRASPACE_REQUIRE_BACKEND: "1"
          BRASPACE_BROWSER_ARTIFACTS: ${{ runner.temp }}/braspace-browser-artifacts
        run: |
          set -euo pipefail
          # Do not hit another agent's stale API on 8080 or preview on 5377.
          # Keep both sockets reserved until the unique ports are chosen.
          read -r BRASPACE_API_PORT BRASPACE_BROWSER_PORT < <(python3 - <<'PY'
          import socket
          sockets = [socket.socket(), socket.socket()]
          try:
              for sock in sockets:
                  sock.bind(("127.0.0.1", 0))
              print(*(sock.getsockname()[1] for sock in sockets))
          finally:
              for sock in sockets: sock.close()
          PY
          )
          export BRASPACE_API_PORT BRASPACE_BROWSER_PORT
          export LISTEN_ADDR="127.0.0.1:${BRASPACE_API_PORT}"
          "$RUNNER_TEMP/braspace-api" >"$RUNNER_TEMP/braspace-browser-backend.log" 2>&1 &
          apipid=$!
          trap 'kill "$apipid" 2>/dev/null || true; wait "$apipid" 2>/dev/null || true; cat "$RUNNER_TEMP/braspace-browser-backend.log"' EXIT
          healthy=0
          for i in $(seq 1 80); do
            # Never accept a 200 from some other Go process: our PID must still be alive.
            if ! kill -0 "$apipid" 2>/dev/null; then
              echo "BRASPACE browser QA: own Go API exited before readiness" >&2
              exit 1
            fi
            if curl -fsS --max-time 1 "http://127.0.0.1:${BRASPACE_API_PORT}/readyz" >/dev/null 2>&1; then healthy=1; break; fi
            sleep 0.25
          done
          if [ "$healthy" != 1 ]; then echo "BRASPACE browser QA: own Go API not ready" >&2; exit 1; fi
          node web/browser/e2e.mjs
      - name: Upload screenshots, even after test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonproof-polar-lab-chromium
          path: ${{ runner.temp }}/braspace-browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
