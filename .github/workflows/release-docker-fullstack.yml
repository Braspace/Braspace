name: BRASPACE Fullstack Docker Release

on:
  pull_request:
    paths:
      - "api/**"
      - "engine/**"
      - "web/**"
      - "tests/**"
      - "science/**"
      - "Dockerfile"
      - "Dockerfile.web"
      - "compose*.yaml"
      - ".github/workflows/release-docker-fullstack.yml"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonproof-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Frontend lint & tests Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check every MoonProof module
        run: npm --prefix web run lint
      - name: Full web, source integrity and UI route tests
        run: npm --prefix web test
      - name: Onboard 3DOF and API source tests
        run: node --test web/onboard/test/*.mjs

  go-rust:
    name: Go API + Rust engine + NASA manifests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: NASA raw dataset manifest verifier
        run: python3 -m unittest discover -s tests -v
      - name: Rust unit + integration suite
        run: cargo test --manifest-path engine/Cargo.toml --locked --all-targets
      - name: Go static analyzer
        working-directory: api
        run: go vet ./...
      - name: Go race and API source contracts
        working-directory: api
        run: go test -race -count=1 ./...
      - name: Compile Go/Rust executables
        run: |
          cargo build --locked --manifest-path engine/Cargo.toml --release
          cd api && CGO_ENABLED=0 go build -trimpath -o /tmp/braspace-api .

  postgres:
    name: PostgreSQL ingest and source hash readback
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: braspace
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: braspace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U braspace" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://braspace:ci-only-throwaway@127.0.0.1:5432/braspace?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Build real Rust evaluator
        run: cargo build --locked --manifest-path engine/Cargo.toml
      - name: DB migrations, ingest, verify and Go API integration
        working-directory: api
        run: go test -race -count=1 ./...

  docker-e2e:
    name: Release Compose + Go/Rust + browser
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [web, go-rust, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate release Docker Compose graph
        run: docker compose -f compose.yaml -f compose.release.yaml config --quiet
      - name: Build and start API and MoonProof web containers
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.release.yaml up --build -d
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null &&
               curl -fsS http://127.0.0.1:5173/moonproof/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5173/moonproof/ > /tmp/moonproof-release.html
          curl -fsS http://127.0.0.1:5173/api/health > /tmp/go-via-web.json
          python3 -c 'import json; j=json.load(open("/tmp/go-via-web.json")); assert j["status"]=="ok"'
      - name: Anonymous route and same-origin backend smoke
        run: |
          set -euo pipefail
          for page in index mission explore compare recover cockpit landing debrief evidence learn plan; do
            curl --fail-with-body -sS "http://127.0.0.1:5173/moonproof/$page.html" -o /dev/null
          done
          ./scripts/smoke-publico.sh http://127.0.0.1:5173 http://127.0.0.1:8080
      - name: Install real Chromium for V3 mobile and desktop QA
        working-directory: web
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Fullscreen lunar workflow and responsive browser QA
        env:
          BRASPACE_V3_URL: http://127.0.0.1:5173
        run: node web/moonproof/tests/visual-e2e.mjs
      - name: Collect Compose logs and stop isolated stack
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.release.yaml logs --no-color > /tmp/braspace-compose-release.log 2>&1 || true
          docker compose -f compose.yaml -f compose.release.yaml down --volumes || true
      - name: Archive real CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: braspace-release-docker-evidence
          path: |
            /tmp/braspace-compose-release.log
            /tmp/go-via-web.json
            /tmp/moonproof-v3-*.png
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish source-reviewed API + frontend to GHCR (private release gate)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.BRASPACE_GHCR_RELEASE_ENABLED == 'true'
    needs: [web, go-rust, postgres, docker-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/braspace-api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/braspace-api:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moonproof-web:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/moonproof-web:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
