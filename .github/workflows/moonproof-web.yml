name: BRASPACE MoonProof Web UI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/moonproof-web.yml"
  push:
    branches:
      - "main"
      - "feat/moonproof-3d-web-20261114"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: npm --prefix web run lint
      - name: Run same-origin server and science-honesty tests
        run: npm --prefix web test
      - name: Unit regressions for synthetic onboard cockpit (12 tabs, 75 features)
        run: node --test web/onboard/test/*.mjs
