name: Source-derived NAIF series integrity
on:
  push:
    branches: [test/naif-source-artifact-integrity-20261114]
    paths:
      - "api/cmd/validatederivedseries/**"
      - "api/internal/pyjson/**"
      - ".github/workflows/naif-series-integrity.yml"
  pull_request:
    paths:
      - "api/cmd/validatederivedseries/**"
      - "api/internal/pyjson/**"
      - ".github/workflows/naif-series-integrity.yml"
      - "science/evidence/**"
      - "api/sitedata/**"
permissions:
  contents: read
jobs:
  provenance:
    name: Pinned NASA artifact and false-claim regression
    # CI_RUNS_ON selects the runner (self-hosted exo-x1 while hosted minutes are blocked by billing; see ci.yml).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go -C api vet ./cmd/validatederivedseries ./internal/pyjson
      - run: go -C api run ./cmd/validatederivedseries
      - run: go -C api test -count=1 -v ./cmd/validatederivedseries ./internal/pyjson
