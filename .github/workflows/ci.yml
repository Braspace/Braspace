name: CI
# One workflow. Everything it tests lives in the Dockerfile (`--target test`) and scripts/ci-local.sh,
# so any machine with Docker runs the same thing:  bash scripts/ci-local.sh [--browser]
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      # Layer cache for every Dockerfile stage (Go/Rust/Node/Python builds and tests).
      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: buildx-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run scripts/ci-local.sh (all tests, Compose + Postgres, endpoints, Chromium)
        env:
          BRASPACE_CI_CACHE: /tmp/.buildx-cache
        run: bash scripts/ci-local.sh --browser

  release:
    # Only after every test passed, and only for main or a v* tag.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build target `release` (its build depends on `test`) and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          push: true
          tags: |
            ghcr.io/braspace/braspace:${{ github.sha }}
            ghcr.io/braspace/braspace:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
