name: LOLA south-pole science prototype
on:
  push:
    branches:
      - feat/lola-southpole-horizon-science-20261114
    paths:
      - "science/**"
      - ".github/workflows/lola-science.yml"
  pull_request:
    paths:
      - "science/**"
      - ".github/workflows/lola-science.yml"
permissions:
  contents: read
jobs:
  model:
    name: terrain-horizon-projection-tests
    # CI_RUNS_ON selects the runner (self-hosted exo-x1 while hosted minutes are blocked by billing; see ci.yml).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python3 -m py_compile science/lola_horizon.py
      - name: Test projection, geometry and failure modes
        run: python3 -m unittest discover -s science/tests -v
