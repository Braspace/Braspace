# Production-like release smoke: Go/Rust API and same-origin MoonProof web.
# Loopback-only publishing; use TLS reverse proxy and approved origins in deployment.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      BRASPACE_API_HOST: api
      BRASPACE_API_PORT: "8080"
      BRASPACE_WEB_HOST: "0.0.0.0"
      BRASPACE_WEB_PORT: "5173"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:5173/moonproof/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
