# OPTIONAL overlay on top of compose.yaml + compose.db.yaml.
# Usage: docker compose -f compose.yaml -f compose.db.yaml -f compose.vector.yaml up --build
# Runs `api vector-ingest` to apply api/db/optional-vector.sql and seed
# provenance-linked metadata embeddings (never used for lunar physics).
services:
  db:
    image: pgvector/pgvector:pg16
  vector-ingest:
    build:
      context: .
    command: ["/app/bin/api", "vector-ingest"]
    environment:
      DATABASE_URL: "postgres://braspace:${POSTGRES_PASSWORD}@db:5432/braspace?sslmode=disable"
      VECTOR_DATABASE_URL: "postgres://braspace:${POSTGRES_PASSWORD}@db:5432/braspace?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    restart: "no"
  api:
    environment:
      BRASPACE_VECTOR_ENABLED: "${BRASPACE_VECTOR_ENABLED:-1}"
      BRASPACE_VECTOR_MODEL_ID: "${BRASPACE_VECTOR_MODEL_ID:-braspace-lexical-384-v1}"
      VECTOR_DATABASE_URL: "postgres://braspace:${POSTGRES_PASSWORD}@db:5432/braspace?sslmode=disable"
    depends_on:
      vector-ingest:
        condition: service_completed_successfully
