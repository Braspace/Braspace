# PostgreSQL variant (BS-020). Usage:
#   cp .env.example .env   # then set POSTGRES_PASSWORD (hex, e.g. openssl rand -hex 16)
#   docker compose -f compose.yaml -f compose.db.yaml up --build
# The database is only reachable inside the compose network.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: braspace
      POSTGRES_DB: braspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braspace -d braspace"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/bin/api", "ingest"]
    environment:
      DATABASE_URL: "postgres://braspace:${POSTGRES_PASSWORD}@db:5432/braspace?sslmode=disable"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    environment:
      DATABASE_URL: "postgres://braspace:${POSTGRES_PASSWORD}@db:5432/braspace?sslmode=disable"
    depends_on:
      ingest:
        condition: service_completed_successfully

volumes:
  pgdata:
